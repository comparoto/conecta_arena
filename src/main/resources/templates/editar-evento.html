<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}">
    <title>Editar Evento - ConectaArena</title>
</head>
<body>

<div th:replace="~{fragments :: cabecalho}" th:with="paginaAtiva='eventos-admin'"></div>

<div class="container">
    <div class="suggestion-box">
        <h2 class="card-title">Modificar Evento</h2>
        <p class="event-info">Altere os dados do evento selecionado abaixo.</p>

        <form th:action="@{/admin/eventos/atualizar}" method="POST">
            <input type="hidden" name="id" th:value="${evento.id}">

            <div class="form-control-group">
                <label class="label-bold">TÍTULO DO EVENTO</label>
                <input type="text" name="titulo" th:value="${evento.titulo}" required class="form-control">
            </div>

            <div class="form-control-group">
                <label class="label-bold">DATA E HORÁRIO</label>
                <input type="datetime-local" name="data" th:value="${evento.data}" required class="form-control">
            </div>

            <div class="form-control-group">
                <label class="label-bold">CATEGORIA</label>
                <input type="text" name="categoria" th:value="${evento.categoria}" required class="form-control">
            </div>

            <div class="form-control-group">
                <label class="label-bold">TOTAL DE VAGAS</label>
                <input type="number" name="ingressosDisponiveis" th:value="${evento.ingressosDisponiveis}" required class="form-control">
            </div>

            <div class="form-control-group">
                <label class="label-bold">PREÇO DO INGRESSO</label>
                <input type="number" step="0.01" name="preco" th:value="${evento.preco}" required class="form-control">
            </div>

            <div class="form-control-group">
                <label class="label-bold">URL DA IMAGEM</label>
                <input type="text" name="imagem" th:value="${evento.imagem}" class="form-control">
            </div>

            <button type="submit" class="btn cadastro-link w-100">SALVAR ALTERAÇÕES</button>
        </form>
    </div>
</div>

<footer>
    <p>&copy; 2026 ConectaArena. Todos os direitos reservados.</p>
</footer>
</body>
</html>
